"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = "npm install"
run_mode = "concurrent"

[scripts.run.dev]
command = "npm run dev -- --port \"$CONDUCTOR_PORT\""
available_in = [ "local" ]
default = true
icon = "play"

[scripts.run.lint]
command = "npm run lint"
icon = "search-check"

[scripts.run.build]
command = "npm run build"
icon = "hammer"
